<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060914">
<title>HALO LINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:ital,wght@0,500;0,700;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
</head>
<body data-scr="title">

<!-- ===== タイトル ===== -->
<section class="scr on" id="title">
  <div class="t-bg"></div>
  <div class="t-logo"><span>HALO</span><b>LINK</b><small>CARD BATTLE</small></div>
  <div class="t-load"><i id="tBar"></i></div>
  <p class="t-start" id="tStart">TAP TO START</p>
</section>

<!-- ===== ホーム ===== -->
<section class="scr" id="home">
  <div class="h-bg" id="hBg"></div>
  <img class="h-char" id="hChar" alt="">
  <div class="h-top in">
    <div class="h-name" id="hName"></div>
    <div class="h-aff" id="hAff"></div>
  </div>
  <div class="h-talk" id="hTalk"><p></p></div>
  <div class="h-side in">
    <button class="h-pack" id="hPack"><span>PACK</span><b id="hPackN">0</b></button>
  </div>
  <button class="h-go in" id="hGo"><small>NEXT STAGE</small><b id="hNext"></b><span>出撃</span></button>
</section>

<!-- ===== ステージ ===== -->
<section class="scr" id="stage">
  <div class="sc-bg" style="background-image:url(bg_battle.webp)"></div>
  <header class="hd in"><div><em>STAGE</em><b>回廊区画</b></div><div class="res"><span>券</span><b data-hud="ticket">0</b></div></header>
  <div class="st-party in" id="stParty"></div>
  <button class="st-edit in" id="stEdit">デッキとパートナーを編集</button>
  <div class="st-list" id="stList"></div>
</section>

<!-- ===== パック ===== -->
<section class="scr" id="pack">
  <div class="sc-bg" style="background-image:url(bg_gacha.webp)"></div>
  <header class="hd in"><div><em>BOOSTER</em><b>パック</b></div><div class="res"><span>券</span><b data-hud="ticket">0</b><span>PT</span><b data-hud="pt">0</b></div></header>
  <div class="pk-view in" id="pkView"></div>
  <p class="pk-rate in" id="pkRate"></p>
  <div class="pk-act in">
    <button class="btn main big" id="pkOpen"><b>開封する</b><small></small></button>
    <p class="pk-timer" id="pkTimer"></p>
  </div>
</section>

<!-- ===== デッキ ===== -->
<section class="scr" id="deck">
  <div class="sc-bg dark" style="background-image:url(bg_home.webp)"></div>
  <header class="hd in"><div><em>DECK</em><b>デッキ編成</b></div><div class="dk-count" id="dkCount"></div></header>
  <div class="dk-scroll">
    <p class="lab in">PARTNER<small>EXスキルと常時効果。好感度はパートナーに入ります</small></p>
    <div class="dk-partner in" id="dkPartner"></div>
    <div class="dk-pinfo in" id="dkPinfo"></div>
    <p class="lab in">DECK<button class="mini" id="dkAuto">おまかせ</button></p>
    <div class="dk-list in" id="dkList"></div>
    <p class="lab in">CARDS<small>タップでデッキに入れる（同じカードは2枚まで。耀平の基本カードは4枚、♛は1枚）</small></p>
    <div class="tabs in" id="dkTabs"></div>
    <div class="dk-own" id="dkOwn"></div>
  </div>
</section>

<!-- ===== 図鑑 ===== -->
<section class="scr" id="book">
  <div class="sc-bg dark" style="background-image:url(bg_gacha.webp)"></div>
  <header class="hd in"><div><em>COLLECTION</em><b>カード図鑑</b></div><div class="bk-rate" id="bkRate"></div></header>
  <div class="tabs in" id="bkTabs"></div>
  <div class="bk-grid" id="bkGrid"></div>
</section>

<!-- ===== バトル ===== -->
<section class="scr" id="battle">
  <div class="b-field" id="bField">
    <div class="b-bg"></div>
    <div class="b-head">
      <button class="mini" id="bRetreat">撤退</button>
      <span class="b-stage" id="bStage"></span>
      <span class="b-wave">WAVE <b id="bWave">1/1</b></span>
    </div>
    <div id="bEnemies"></div>
    <div class="b-pbox" id="bPbox">
      <img id="bPartner" alt="">
      <div class="b-pinfo"><span id="bPname"></span><div class="b-gauge" id="bGauge"></div><em>EX</em></div>
    </div>
    <div class="b-me">
      <div class="b-block" id="bBlock"><svg viewBox="0 0 24 24"><path d="M12 2l9 3v6c0 6-4 10-9 11C7 21 3 17 3 11V5z"/></svg><b>0</b></div>
      <div class="b-hp" id="bHp"><i id="bHpBar"></i><span>耀平</span><b id="bHpNum"></b></div>
      <div class="b-st" id="bSt"></div>
    </div>
    <div id="bBanner"></div>
    <div id="bTurn"></div>
    <div id="bFlash"></div>
  </div>
  <div class="b-bar">
    <div class="b-energy" id="bEnergy"><b>3</b><small>/3</small></div>
    <button class="b-pile" id="bPileD"><i>山札</i><b id="bDraw">0</b></button>
    <button class="b-pile" id="bPileX"><i>捨て札</i><b id="bDisc">0</b></button>
    <button class="b-end" id="bEnd">ターン終了</button>
  </div>
  <div id="hand"></div>
  <div id="preview"></div>
</section>

<!-- 重ねて出すもの -->
<div id="cut"><div class="c-bg"></div><i class="c-s1"></i><i class="c-s2"></i><div class="c-art"><img alt=""></div>
  <div class="c-txt"><span class="cn"></span><b class="cs"></b><p class="cd"></p></div></div>
<div id="po"></div>
<div id="detail"></div>
<div id="lobbyView"></div>
<div id="over"></div>
<div id="toast"></div>

<nav id="nav" class="hide">
  <button data-go="home"><i class="ic i-home"></i>ホーム</button>
  <button data-go="stage"><i class="ic i-stage"></i>バトル</button>
  <button data-go="pack"><i class="ic i-pack"></i>パック<em id="navBadge"></em></button>
  <button data-go="deck"><i class="ic i-deck"></i>デッキ</button>
  <button data-go="book"><i class="ic i-book"></i>図鑑</button>
</nav>

<script src="data.js"></script>
<script src="save.js"></script>
<script src="sfx.js"></script>
<script src="card.js"></script>
<script src="battle.js"></script>
<script src="pack.js"></script>
<script src="ui.js"></script>
</body>
</html>
